name: Test API
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore api/Booking.Api.sln
      - run: dotnet build api/Booking.Api.sln --no-restore --configuration Release
      - run: dotnet test api/Booking.Api.Tests/Booking.Api.Tests.csproj --no-build --configuration Release
